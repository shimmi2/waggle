<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waggle nad AdminLTE</title>
<link rel="stylesheet" href="vendor/bootstrap-icons/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="vendor/bootstrap/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="vendor/adminlte/dist/css/adminlte.min.css">
</head>
<body class="layout-fixed sidebar-expand-lg bg-body-tertiary">

<!-- Chyby jdou do Bootstrap toastů (viz app2.js) -->
<div id="fw_toasts" class="toast-container position-fixed top-0 end-0 p-3" style="z-index:1090"></div>

<!-- ================================================================
     Shell je STATICKÝ a nikdy se nepřekresluje. Po drátě jdou jen
     tři vnitřky:  #left_menu, #top_frame, #main
     ================================================================ -->
<div class="app-wrapper">

    <nav class="app-header navbar navbar-expand bg-body">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" data-lte-toggle="sidebar" href="#" role="button">
                        <i class="bi bi-list"></i>
                    </a>
                </li>
            </ul>
            <!-- cíl není div, ale <ul> — protokol adresuje selektorem, ne typem prvku -->
            <ul class="navbar-nav ms-auto" id="top_frame"></ul>
        </div>
    </nav>

    <aside class="app-sidebar bg-body-secondary shadow" data-bs-theme="dark">
        <div class="sidebar-brand">
            <a href="#?function=index" data-fw class="brand-link">
                <i class="bi bi-diagram-3 brand-image ms-3 me-2"></i>
                <span class="brand-text fw-light">Demo nad AdminLTE</span>
            </a>
        </div>
        <div class="sidebar-wrapper">
            <!-- Hledání v menu: stačí tenhle input, zbytek dělá AdminLTE.
                 Filtruje živě i položky, které přišly po drátě. -->
            <div class="px-3 pt-3 pb-1">
                <div class="input-group input-group-sm">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="search" class="form-control" placeholder="Hledat v menu…"
                           data-lte-toggle="sidebar-search" aria-label="Hledat v menu">
                </div>
                <div class="text-secondary small mt-2 d-none" data-lte-search-empty>
                    <i class="bi bi-dash-circle me-1"></i>Nic nenalezeno
                </div>
            </div>
            <nav class="mt-2">
                <ul class="nav sidebar-menu flex-column" id="left_menu"
                    data-lte-toggle="treeview" role="menu" data-accordion="false"></ul>
            </nav>
        </div>
    </aside>

    <main class="app-main">
        <div class="app-content pt-3">
            <div class="container-fluid" id="main"></div>
        </div>
    </main>

    <footer class="app-footer">
        <div class="float-end d-none d-sm-inline">shell statický, obsah po drátě</div>
        <strong>Framework demo</strong> — AdminLTE 4.9.1
    </footer>
</div>

<script src="vendor/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="vendor/adminlte/dist/js/adminlte.min.js"></script>
<script src="../fw.js"></script>
<script src="app2.js"></script>
</body>
</html>
